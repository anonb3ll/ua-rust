[package]
name = "ua-tools"
description = "Tool registry, the governed call wrapper, and the ua-rust tool families."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# These three are on by default, so a build with no feature flags matches a
# build from before they were optional. `--no-default-features` drops them.
default = ["tree-sitter", "dom_smoothie", "rmcp"]
# Local semantic memory search with fastembed. Off by default: without it,
# memory search is lexical (FTS5) only. The feature lives in ua-memory.
embeddings = ["ua-memory/embeddings"]
# `fs_index_symbols`, `fs_list_symbols`, `fs_search_symbols`, `fs_repo_map`.
tree-sitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
]
# Readability pass inside `web_fetch` and `dash_view`. Without it those tools
# still run and convert the whole HTML page.
dom_smoothie = ["dep:dom_smoothie"]
# Downstream MCP client (`mcp_gateway`).
rmcp = ["dep:rmcp"]

[dependencies]
subtle.workspace = true
ua-core = { workspace = true, features = ["rusqlite"] }
ua-store.workspace = true
ua-memory.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
jiff.workspace = true
tokio.workspace = true
# CancellationToken: `ua serve` stops the background loops with one token.
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1.12"
# Policy file (YAML) and config revision diffs.
serde-saphyr = "2.2"
similar = "3.2"
# Routines: cron schedules (five-field, UTC).
croner = "4.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ulid.workspace = true
secrecy.workspace = true
# Vault family: Markdown AST (wikilinks, front matter) and YAML front matter.
comrak = { version = "1.0", default-features = false }
# Vault family: the Obsidian Local REST API client (loopback only). rustls
# with the ring provider keeps the C toolchain out of the build.
uuid = { workspace = true, features = ["v4"] }

# web and code families
# Shared HTTP client (web, vault/Obsidian, notify webhooks). ring as the rustls provider: no C
# toolchain (aws-lc-sys) needed.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dom_smoothie = { version = "0.19", optional = true }
htmd = "0.6"
dom_query = "0.29"
base64 = "0.22"
url = "2.5"
# Relay gates: Unicode properties (default-ignorable, unassigned, private
# use), NFKC, and HTML entity decoding. All three were already in the tree
# (url's IDNA support and dom_smoothie).
icu_properties = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
html-escape = "0.2"
encoding_rs = "0.8"
toml = "0.8"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }

# Managed secrets: AES-256-GCM at rest and an HMAC-SHA256 fingerprint. Both
# RustCrypto crates were already in the dependency tree (cookie, webauthn-rs).
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
hmac = "0.13"
# MCP gateway: the client side of the official SDK (the server side is in
# ua-server), over a child's stdio or Streamable HTTP through our reqwest.
rmcp = { version = "=3.11.0", optional = true, default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
axum = "0.8.9"
# The fake downstream MCP server in tests/mcp_gateway.rs.
rmcp = { version = "=3.11.0", features = ["server", "transport-io", "transport-streamable-http-server"] }

# Runs its own small harness so the test binary can double as the fake stdio
# MCP server it spawns (libtest would write to the child's stdout first). It
# speaks enough of libtest's CLI for cargo test and cargo nextest.
[[test]]
name = "mcp_gateway"
harness = false
