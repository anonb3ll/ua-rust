[package]
name = "ua-tools"
description = "Tool registry, the governed call wrapper, and the ua-rust tool families."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Local semantic memory search with fastembed. Off by default: without it,
# memory search is lexical (FTS5) only.
embeddings = ["dep:fastembed"]

[dependencies]
ua-core = { workspace = true, features = ["rusqlite"] }
ua-store.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
    "hf-hub-rustls-tls",
    "onnx",
    "ort-download-binaries-rustls-tls",
[target.'cfg(unix)'.dependencies]
] }
fastembed = { version = "7.7", optional = true, default-features = false, features = [
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1.12"
ulid.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
