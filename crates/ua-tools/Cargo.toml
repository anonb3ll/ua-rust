[package]
name = "ua-tools"
description = "Tool registry, the governed call wrapper, and the ua-rust tool families."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Local semantic memory search with fastembed. Off by default: without it,
# memory search is lexical (FTS5) only.
embeddings = ["dep:fastembed"]

[dependencies]
ua-core = { workspace = true, features = ["rusqlite"] }
ua-store.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1.12"
# Policy file (YAML) and config revision diffs.
serde-saphyr = "2.2"
similar = "3.2"
ulid.workspace = true
secrecy.workspace = true
# Vault family: Markdown AST (wikilinks, front matter) and YAML front matter.
comrak = { version = "1.0", default-features = false }
# Vault family: the Obsidian Local REST API client (loopback only). rustls
# with the ring provider keeps the C toolchain out of the build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { workspace = true, features = ["v4"] }
fastembed = { version = "7.7", optional = true, default-features = false, features = [
    "hf-hub-rustls-tls",
    "onnx",
    "ort-download-binaries-rustls-tls",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
