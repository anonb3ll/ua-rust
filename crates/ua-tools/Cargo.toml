[package]
name = "ua-tools"
description = "Tool registry, the governed call wrapper, and the ua-rust tool families."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Local semantic memory search with fastembed. Off by default: without it,
# memory search is lexical (FTS5) only.
embeddings = ["dep:fastembed"]

[dependencies]
ua-core = { workspace = true, features = ["rusqlite"] }
ua-store.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1.12"
ulid.workspace = true
uuid = { workspace = true, features = ["v4"] }
fastembed = { version = "7.7", optional = true, default-features = false, features = [
    "hf-hub-rustls-tls",
    "onnx",
    "ort-download-binaries-rustls-tls",
] }

# web and code families
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2"] }
# ring as the rustls provider: no C toolchain (aws-lc-sys) needed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dom_smoothie = "0.19"
htmd = "0.6"
dom_query = "0.29"
base64 = "0.22"
url = "2.5"
encoding_rs = "0.8"
secrecy.workspace = true
toml = "0.8"
serde-saphyr = "2.2"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
axum = "0.8.9"
