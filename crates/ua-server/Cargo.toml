[package]
name = "ua-server"
description = "HTTP/JSON API, MCP adapter and web UI for ua-rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
# On by default, so `cargo build -p ua-server` still serves MCP and links the
# same ua-tools extras as before. `--no-default-features` drops all four.
default = ["code-intel", "readability", "mcp-gateway", "mcp-server", "slack-socket"]
code-intel = ["ua-tools/code-intel"]
readability = ["ua-tools/readability"]
mcp-gateway = ["ua-tools/mcp-gateway"]
# The hub's own MCP server: the `/mcp` route, `serve_stdio` (`ua mcp`) and the
# OAuth protected resource metadata for `/mcp`. Without it the hub serves the
# JSON API, the UI and OAuth for `/api` only.
mcp-server = ["dep:rmcp", "ua-tools/mcp-server"]
# Slack Socket Mode: an outbound WebSocket to Slack, so a hub with no public
# URL can serve Slack. On by default (it adds only tungstenite's protocol code;
# TLS is the rustls + ring + platform verifier stack reqwest already uses), and
# it does nothing until `slack_socket_mode` and `UA_SLACK_APP_TOKEN` are set.
# Without it, `slack_socket_mode = true` is reported as not compiled in.
slack-socket = [
    "dep:tokio-tungstenite",
    "dep:tokio-rustls",
    "dep:rustls-platform-verifier",
    "ua-tools/slack-socket",
]
# Off by default, as in ua-tools.
embeddings = ["ua-tools/embeddings"]
embeddings-dynamic = ["ua-tools/embeddings-dynamic"]

[dependencies]
ua-core.workspace = true
ua-ingress.workspace = true
ua-store.workspace = true
ua-tools = { workspace = true, default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8.9"
tower-http = { version = "0.7", features = ["trace"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
http-body-util = "0.1"
sha2.workspace = true
hex.workspace = true
subtle.workspace = true
secrecy.workspace = true
rusqlite.workspace = true
rmcp = { version = "=3.11.0", optional = true, features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
jiff.workspace = true
rand.workspace = true
ulid.workspace = true
uuid.workspace = true
base64 = "0.22"
url = "2.5"
axum-extra = { version = "0.12", features = ["cookie-private"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
# Same TLS setup as ua-tools: rustls with the ring provider (no C toolchain).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Slack Socket Mode (feature `slack-socket`): the WebSocket protocol only. No
# TLS feature of its own: the connection is wrapped in tokio-rustls with the
# platform verifier, the same rustls/ring stack reqwest uses.
tokio-tungstenite = { version = "0.28", optional = true, default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = { version = "0.7", optional = true }
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
memory-serve = "2.4.0"
serde_urlencoded = "0.7"

[build-dependencies]
memory-serve = "2.4.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing-subscriber.workspace = true
