[package]
name = "ua-server"
description = "HTTP/JSON API, MCP adapter and web UI for ua-rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ua-core.workspace = true
ua-store.workspace = true
ua-tools.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8.9"
tower-http = { version = "0.7", features = ["trace"] }
tokio-util = "0.7"
futures = "0.3"
sha2.workspace = true
hex.workspace = true
subtle.workspace = true
secrecy.workspace = true
rusqlite.workspace = true
rmcp = { version = "=3.11.0", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
jiff.workspace = true
rand.workspace = true
ulid.workspace = true
uuid.workspace = true
base64 = "0.22"
url = "2.5"
axum-extra = { version = "0.12", features = ["cookie-private"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
# Same TLS setup as ua-tools: rustls with the ring provider (no C toolchain).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
memory-serve = "2.4.0"
serde_urlencoded = "0.7"

[build-dependencies]
memory-serve = "2.4.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
