[package]
name = "ua-cli"
description = "The ua command: hub server, MCP stdio adapter and tool CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ua"
path = "src/main.rs"

[features]
# On by default, so `ua` with no feature flags is the same binary as before.
# `--no-default-features` builds it without tree-sitter, dom_smoothie and
# rmcp. See "Build options" in the README.
default = ["code-intel", "readability", "mcp-gateway", "mcp-server", "slack-socket"]
code-intel = ["ua-tools/code-intel", "ua-server/code-intel", "ua-import/code-intel"]
readability = ["ua-tools/readability", "ua-server/readability", "ua-import/readability"]
mcp-gateway = ["ua-tools/mcp-gateway", "ua-server/mcp-gateway", "ua-import/mcp-gateway"]
# `ua mcp` and the `/mcp` route of `ua serve`.
mcp-server = ["ua-server/mcp-server"]
# Slack Socket Mode in `ua serve` (an outbound WebSocket; no public URL).
slack-socket = ["ua-server/slack-socket"]
# Off by default: semantic memory search with fastembed.
embeddings = ["ua-tools/embeddings", "ua-server/embeddings", "ua-import/embeddings"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
ua-core.workspace = true
ua-store.workspace = true
ua-tools = { workspace = true, default-features = false }
ua-server = { workspace = true, default-features = false }
ua-import = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util = "0.7"
rand.workspace = true
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
