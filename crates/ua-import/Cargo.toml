[package]
name = "ua-import"
description = "Import a database from the original Python hub into a ua-rust database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
# On by default so this crate still links the same ua-tools as a default
# build. `--no-default-features` does not pull the heavy deps back in.
default = ["tree-sitter", "dom_smoothie", "rmcp"]
tree-sitter = ["ua-tools/tree-sitter"]
dom_smoothie = ["ua-tools/dom_smoothie"]
rmcp = ["ua-tools/rmcp"]

[dependencies]
ua-core = { workspace = true, features = ["rusqlite"] }
ua-store.workspace = true
ua-tools = { workspace = true, default-features = false }
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
