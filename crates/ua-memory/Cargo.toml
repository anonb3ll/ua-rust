[package]
name = "ua-memory"
description = "Memory notes for ua-rust: storage schema, note model, hybrid search, embeddings and lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
default = []
# Local semantic memory search with fastembed (pre-built ONNX Runtime).
# Off by default: without it, memory search is lexical (FTS5) only unless an
# HTTP embedder is configured. `hf-hub` is deliberately omitted so save, search
# and system_doctor can never download models at runtime; `ua memory models fetch`
# prepares the verified local files offline.
embeddings = ["dep:fastembed", "fastembed/onnx", "fastembed/ort-download-binaries-rustls-tls"]
# Local semantic memory search loading ONNX Runtime dynamically (`ort/load-dynamic`)
# for release builds that ship or point to a verified runtime library.
embeddings-dynamic = ["dep:fastembed", "fastembed/onnx", "fastembed/ort-load-dynamic"]

[dependencies]
ua-core = { workspace = true, features = ["rusqlite"] }
ua-store.workspace = true
ua-org.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
fastembed = { version = "7.7", optional = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true
