# Exact-head CI on Cloud Build, submitted by scripts/cloud-ci.sh for one commit.
#
# The `vocab` and `check` steps run the jobs of the same name in
# .github/workflows/ci.yml, in parallel. Both may fail without stopping the
# build, so each reports its own result (the `CI / vocab` and `CI / check`
# statuses). The `sdk` step runs the TypeScript SDK's checks (the `verify` job
# of .github/workflows/sdk.yml) beside them, when the commit has sdk/typescript;
# it has no status of its own. The final `full-verification` step fails the
# build unless all three passed. There is no cargo cache: every build compiles
# from scratch, which keeps the build free of state from earlier runs.
substitutions:
  # Pinned by digest to the stable toolchain the GitHub workflow's
  # dtolnay/rust-toolchain resolves to; bump both together. The workspace needs
  # >= 1.88. Resolve a new digest with
  #   docker buildx imagetools inspect rust:<version>-trixie
  _RUST_IMAGE: rust:1.100.0-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8
  # The step that can read the private denylist; pinned for the same reason.
  _GCLOUD_IMAGE: gcr.io/cloud-builders/gcloud@sha256:dc291205504ce8fdb830e55cae4905c7880c7978b03e54b5bcdabe7cab5f8e2e
  # The SDK step's Node (full bookworm image: git, curl, python3), matching
  # node-version in .github/workflows/sdk.yml; pinned for the same reason.
  _NODE_IMAGE: node:22.23.5-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
  # The build's identity, `projects/<project>/serviceAccounts/<email>`, from
  # UA_CI_SERVICE_ACCOUNT. Empty (cloud-ci.sh --default-sa) runs as the
  # project's default build account.
  _CI_SA: ''
  _SOURCE_SHA: unknown
serviceAccount: ${_CI_SA}
steps:
- id: vocab
  waitFor: ['-']
  allowFailure: true
  name: ${_GCLOUD_IMAGE}
  entrypoint: bash
  env:
  - UA_CI_SOURCE_SHA=${_SOURCE_SHA}
  - CLOUDSDK_CORE_DISABLE_PROMPTS=1
  args:
  - -c
  - |
    bash ci-step.sh vocab
    result=$$?
    mkdir -p .ci && printf '%s\n' "$$result" > .ci/vocab.exit
    exit "$$result"
- id: check
  waitFor: ['-']
  allowFailure: true
  name: ${_RUST_IMAGE}
  entrypoint: bash
  env:
  - UA_CI_SOURCE_SHA=${_SOURCE_SHA}
  args:
  - -c
  - |
    bash ci-step.sh check
    result=$$?
    mkdir -p .ci && printf '%s\n' "$$result" > .ci/check.exit
    exit "$$result"
- id: sdk
  waitFor: ['-']
  allowFailure: true
  name: ${_NODE_IMAGE}
  entrypoint: bash
  env:
  - UA_CI_SOURCE_SHA=${_SOURCE_SHA}
  args:
  - -c
  - |
    bash ci-step.sh sdk
    result=$$?
    mkdir -p .ci && printf '%s\n' "$$result" > .ci/sdk.exit
    exit "$$result"
- id: full-verification
  waitFor: [vocab, check, sdk]
  name: ${_RUST_IMAGE}
  entrypoint: bash
  args:
  - -c
  - |
    set -eu
    for job in vocab check sdk; do
      test -f ".ci/$$job.exit"
      test "$$(cat ".ci/$$job.exit")" = 0
    done
tags:
- ua-rust-ci
- sha-${_SOURCE_SHA}
options:
  # 8 vCPUs and 8 GB. A from-scratch workspace build, clippy and the test
  # binaries finish in a fraction of the default machine's time; the
  # per-minute price is several times the default's, so a run costs about the
  # same or less overall. E2_HIGHCPU_32 would cut wall time further at about
  # four times this rate.
  machineType: E2_HIGHCPU_8
  # Required for a user-specified service account, which has no logs bucket.
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
# A build may wait behind others in the project's queue.
queueTtl: 7200s
