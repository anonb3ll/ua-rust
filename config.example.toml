# ua-rust configuration. Copy to $UA_HOME/config.toml.
# UA_* environment variables override anything set here.

home = "~/.ua-rust"
workspace = "~/projects"
# Extra read-only roots for fs_read / fs_list / fs_search.
read_roots = []
# vault_path = "~/notes"
vault_write_dirs = ["Inbox", "Logs", "Wiki"]

bind = "127.0.0.1:8765"
enforce_auth = true
# Host headers /api and /ui answer (DNS-rebinding guard). The host of
# public_url is always allowed too. List any other name the hub is reached
# by, e.g. a private-network name in front of a TLS terminator:
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
# allowed_hosts = ["localhost", "127.0.0.1", "::1", "hub.example.com"]
# Public base URL. Use https:// for anything but loopback: browsers drop the
# Secure session cookie and refuse passkeys on plain http to other hosts.
# public_url = "https://hub.example.com"

# Who counts as a human operator. Only humans resolve approvals.
human_identities = ["operator"]
# Who may retire and un-retire remote nodes (coordination_manage node_retire,
# node_unretire). Unset means human_identities; setting it replaces that list.
# lifecycle_operators = ["operator"]
# Remote nodes one agent may hold in service (registered, not retired).
node_max_per_agent = 8
# node_queue_wait_s = 3600   # how long work waits for an offline node (60-604800)
# node_wait_sweep_s = 60     # node queue sweep interval under `ua serve`; 0 = off
# Origin label stamped on migration manifests (export_migration_manifest).
# Two manifests compare only when their origins match. Unset: "local".
# source_host = "hub-a"
# Mint short-lived session credentials (uas_...) for claimed ACP node items, so
# the session reaches /mcp with a small read/report tool set. Off by default;
# turning it off refuses every outstanding credential at once.
# session_credentials_enabled = false
# Hold real work from a node until an operator has attested its device
# acceptance run (coordination_manage node_acceptance_start / _attest).
# node_require_acceptance = false
# The harness-config root nodes are told about (config_root_hint in
# GET /api/node/config). Advisory: each node writes under its own root.
# harness_config_root_hint = "~/.unified_agent/harness-config"

# Planning canvas (graph_canvas_write): new boards per agent, boards in all,
# and prior scenes kept per board for graph_canvas_history/restore, by count
# and by total bytes (the oldest are dropped first past either).
# graph_canvas_max_boards_per_agent = 50
# graph_canvas_max_boards = 1000
# graph_canvas_history_max = 20
# graph_canvas_history_max_bytes = 10000000

# Client evidence (evidence_append, POST /api/evidence) per identity per
# rolling hour: events and serialized payload bytes. Past either the append
# is refused with rate_limited.
# evidence_append_max_per_hour = 120
# evidence_append_max_bytes_per_hour = 2097152

# Tools that always need a one-time human approval. A tool named here is
# also gated when a consolidated tool runs it as an action (plan_delete gates
# plan_manage action delete); an action with no standalone tool is named as
# tool:action, for example "plan_manage:close". See docs/policy.md.
approval_tools = ["git_merge_task"]

# Programs run_cmd may start. Setting this replaces the built-in list.
# shell_allowlist = ["git", "ls", "cat", "grep", "cargo"]

# Cargo config files above the workspace root that run_cmd's cargo may read
# (cargo reads every ancestor .cargo/config.toml of its cwd). Unlisted ones,
# and listed ones whose content no longer matches the hash, make run_cmd
# refuse cargo; the refusal prints the path and current sha256 to copy here.
# See SECURITY.md.
# trusted_cargo_configs = [
#   { path = "~/.cargo/config.toml", sha256 = "<sha256 of the file>" },
# ]

# Reviewed YAML workflow definitions (workflow_run). Treat this directory as code.
# workflow_dir = "~/.ua-rust/workflows"

# Run due cron routines from `ua serve` once a minute, and allow routine_fire.
routines_enabled = false

# GitHub connector (docs/github.md). The *_env settings name environment
# variables; the token and secret are never written here or to the database.
# Use names outside UA_* (those are read as configuration).
# github_api_url = "https://api.github.com"   # or a GHES API root
# github_token_env = "HUB_GITHUB_TOKEN"        # read-only token for the bound repositories
# github_webhook_secret_env = "HUB_GITHUB_WEBHOOK_SECRET"
# github_poll_interval_s = 0                   # poll open PRs under `ua serve`; 0 = off
# github_ci_apps = ["github-actions"]          # apps whose check runs count as CI (slug or app id)
# github_require_default_branch_workflow = false  # true: the workflow file must match the default branch
# github_ci_latest_attempt_only = false        # true: judge a re-run job on its latest attempt only
# github_webhook_max_age_hours = 24            # refuse webhook payloads older than this; 0 = off
# github_webhook_max_in_flight = 16           # webhook deliveries read or handled at once
# github_webhook_busy_wait_ms = 2000           # wait this long for a slot, then 429
# github_webhook_read_timeout_ms = 10000       # a body slower than this is answered 408
# github_web_host = "github.com"               # host PR links must name (default from github_api_url)
# github_check_workflows = { tests = ".github/workflows/ci.yml", lint = "Lint" }  # check -> workflow name or file
# github_merge_branches = { default = "main" } # project -> merge branch; unlisted: the repo's default branch

# Default autonomous-cycle budgets.
autonomy_max_time_s = 3600.0
autonomy_max_tokens = 100000
autonomy_max_retries = 3
autonomy_max_cost_cents = 1000.0
# Green-path validation gates, run in the task worktree; empty means every
# cycle merge and PR transition waits for a human approval.
# cycle_validation_command = ["cargo", "test", "--quiet"]

# Managed secrets (managed_secret_set) are encrypted at rest with this key:
# 32 random bytes as base64 or hex (`openssl rand -base64 32`). Prefer the
# UA_MANAGED_SECRET_KEY environment variable to keep it out of this file. A
# comma-separated list rotates keys: the first encrypts, all decrypt. Unset,
# secrets cannot be stored. See docs/mcp.md.
# managed_secret_key = "<base64 key>"

# Days an approved MCP server registration or review stays valid (1-365).
# mcp_review_ttl_days = 90

# Public relay (relay_manage): GitHub repositories it may comment on, and the
# managed secret (consumer "relay:github") holding its token. See docs/relay.md.
# relay_github_repos = ["acme/widgets"]
# relay_github_secret = "relay-github"
# relay_github_api_url = "https://api.github.com"
# Host names the relay treats as internal, besides .internal, .local, .lan, ...
# relay_internal_hosts = ["buildbox"]
# relay_max_chars = 10000
# Accounts and teams a relay message may @-mention; every other is refused.
# relay_mention_allowlist = ["acme/maintainers"]
# Link shorteners refused in relay messages (this replaces the default list).
# relay_redirector_hosts = ["bit.ly", "t.co", "tinyurl.com"]
# check/draft runs per caller per hour.
# relay_checks_per_hour = 60
# Private denylist (regular expressions, case-insensitive). Never echoed or
# logged. Prefer UA_RELAY_DENYLIST (one pattern per line) to keep it out of
# this file.
# relay_denylist = ["project[- ]codename"]

# Zulip (see docs/zulip.md). Both tools stay off until zulip_site,
# zulip_email and the API key are set. Set the API key in the hub's
# environment as UA_ZULIP_API_KEY, not in this file; it is never logged.
# zulip_send_message also stays retired until zulip_retired is 0, false, no
# or off, and every send needs a human approval of the exact text.
# zulip_site = "https://chat.example.com"
# zulip_email = "bot@example.com"
# zulip_retired = "0"
# Hosts a message may link to; every other link is refused.
# zulip_link_hosts = ["docs.example.com"]
# Users a message may @-mention; wildcards and groups are always refused.
# zulip_mention_allowlist = ["Jane Doe"]
# zulip_send_calls_per_hour = 30
# Logical channel names agents use, mapped to Zulip stream names.
# [zulip_channels]
# general = "general"

# Default profile per identity. Unlisted identities get "developer". Profiles:
# coordinator, lead, developer, reviewer, operator, research, acp-session,
# remote-vault-curator, remote-assistant, public (see docs/policy.md).
[profiles]
operator = "operator"
lead-1 = "lead"
reviewer-1 = "reviewer"

# Per-agent workspace roots, or "deny".
[agent_workspaces]
# researcher-1 = "deny"

# Agent harnesses dispatch_task may start (see docs/dispatch.md). A harness
# may name the provider account it bills (provider_account_register); dispatch
# refuses it while that account is disabled or rate-limited, or, with
# provider_fallback, runs another harness whose account has the same provider
# and billing type (provider_fallback_cross_billing = true allows any billing).
# Secrets never go in `env` (credential-looking values are refused at load):
# list their names in env_allowlist and the hub's environment passes them.
# quota_patterns are phrases on the child's stderr that mark a usage limit.
# [harnesses.coder]
# argv = ["agent-cli", "--print", "{prompt}"]
# env_allowlist = ["PROVIDER_API_KEY"]
# timeout_s = 3600
# provider_account = "anthropic-team"
# provider_fallback = false
# quota_patterns = ["usage limit reached", "insufficient_quota"]

# Pi (pi.dev) in print mode on a subscription account. The provider and model
# are pinned in argv so Pi never falls back to a settings default; metered keys
# are denied even if the hub's environment holds them (dispatch refuses a
# subscription harness that passes an *_API_KEY name it does not deny).
# [harnesses.pi]
# argv = ["pi", "--print", "--mode", "json", "--provider", "openai-codex",
#         "--model", "gpt-5.5", "--no-session", "{prompt}"]
# env_denylist = ["OPENAI_API_KEY", "PI_API_KEY", "OPENROUTER_API_KEY",
#                 "ANTHROPIC_API_KEY", "GEMINI_API_KEY"]
# quota_patterns = ["usage limit", "insufficient_quota", "rate_limit"]
# quota_json_errors = true
# path_prepend = ["~/.local/bin"]
# timeout_s = 3600
# provider_account = "pi-subscription"

# Downstream MCP servers for mcp_gateway, declared by the operator. Same
# fields as mcp_server_register's spec, plus review_expires_at. Secrets are
# managed secret names bound to consumer "mcp:<server>". An empty
# read_profiles admits humans and configured operator identities only; list
# the agent profiles that may read. See docs/mcp.md.
# [mcp_servers.docs]
# transport = "streamable_http"
# url = "https://docs.example.com/mcp"
# address_scope = "public"            # public | private | loopback
# secrets = [{ secret = "docs-token", inject = "bearer" }]
# read_profiles = ["developer", "reviewer"]
# timeout_s = 30
# review_expires_at = "2027-03-01"
#
# [mcp_servers.docs.tools]
# search = "read"
# get_page = "read"
# put_page = "write"

# Slack ingress (docs/slack.md): slash commands at /api/slack/commands and
# Events API callbacks at /api/slack/events. Off by default; both routes
# answer 404 unless slack_enabled is on AND UA_SLACK_SIGNING_SECRET is set in
# the hub's environment (never in this file; the value is never logged or
# stored). The routes need a public HTTPS URL; a hub on a private network
# uses Socket Mode instead (below). Each Slack user who may use them is mapped by (team_id,
# user_id) to a hub identity, which must be in human_identities (never an
# agent label); anyone else is refused. Slack's user_name is never used.
# Commands run as that identity through the normal profile, policy and
# approval checks, recorded with transport "slack". /approve is refused
# unless the mapping sets can_approve = true, so turning Slack on does not
# widen who can approve.
# slack_enabled = false              # UA_SLACK_ENABLED also sets it
#
# [[slack_identities]]
# team_id = "T0000000000"
# user_id = "U0000000000"
# identity = "operator"
# can_approve = false
#
# Slack Socket Mode (docs/slack.md#socket-mode): ua serve opens an outbound
# WebSocket to Slack, so no public URL and no signing secret are needed. Off
# by default; runs when this is on and the app-level token (xapp-..., scope
# connections:write) is in the environment as UA_SLACK_APP_TOKEN, never in
# this file. Uses the same slack_identities and rules as the HTTP routes;
# both may be on at once.
# slack_socket_mode = false          # UA_SLACK_SOCKET_MODE also sets it
