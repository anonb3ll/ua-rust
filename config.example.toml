# ua-rust configuration. Copy to $UA_HOME/config.toml.
# UA_* environment variables override anything set here.

home = "~/.ua-rust"
workspace = "~/projects"
# Extra read-only roots for fs_read / fs_list / fs_search.
read_roots = []
# vault_path = "~/notes"
vault_write_dirs = ["Inbox", "Logs", "Wiki"]

bind = "127.0.0.1:8765"
enforce_auth = true
# Host headers /api and /ui answer (DNS-rebinding guard). The host of
# public_url is always allowed too. List any other name the hub is reached
# by, e.g. a tailnet name in front of `tailscale serve`:
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
# allowed_hosts = ["localhost", "127.0.0.1", "::1", "hub.example-tailnet.ts.net"]
# Public base URL. Use https:// for anything but loopback: browsers drop the
# Secure session cookie and refuse passkeys on plain http to other hosts.
# public_url = "https://hub.example-tailnet.ts.net"

# Who counts as a human operator. Only humans resolve approvals.
human_identities = ["operator"]

# Tools that always need a one-time human approval.
approval_tools = ["git_merge_task"]

# Programs run_cmd may start. Setting this replaces the built-in list.
# shell_allowlist = ["git", "ls", "cat", "grep", "cargo"]

# Default profile per identity. Unlisted identities get "developer".
[profiles]
operator = "operator"
reviewer-1 = "cto"

# Per-agent workspace roots, or "deny".
[agent_workspaces]
# researcher-1 = "deny"
