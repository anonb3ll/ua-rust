name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Team vocabulary and personal identifiers stay out of tracked files.
  # VOCAB_DENYLIST (optional secret) adds private patterns.
  vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/vocab-check.sh
        env:
          VOCAB_DENYLIST: ${{ secrets.VOCAB_DENYLIST }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --no-tests=pass
      - run: cargo test --workspace --doc

  # The hub also runs on macOS, where orphan recovery and the stale-worktree
  # sweep read processes through proc_pidinfo instead of /proc.
  dispatch-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ua-tools --test dispatch
      - run: cargo test -p ua-tools --lib governance::procscan
